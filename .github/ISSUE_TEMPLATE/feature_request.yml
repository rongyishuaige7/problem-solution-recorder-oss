name: Feature request
description: Suggest an improvement to the skill or documentation
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / gap
      description: What workflow is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
