name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck -x skill/problem-solution-recorder/scripts/*.sh

      - name: Validate skill structure
        run: skill/problem-solution-recorder/scripts/validate-skill.sh

      - name: Smoke test
        run: skill/problem-solution-recorder/scripts/smoke-test.sh
