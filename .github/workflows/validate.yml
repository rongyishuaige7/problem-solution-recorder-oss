name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck -x skill/problem-solution-recorder/scripts/*.sh

      - name: Validate skill structure
        run: skill/problem-solution-recorder/scripts/validate-skill.sh

      - name: Scan example knowledge base
        run: skill/problem-solution-recorder/scripts/check-kb.sh examples/minimal-knowledge-base

      - name: Smoke test
        run: skill/problem-solution-recorder/scripts/smoke-test.sh
